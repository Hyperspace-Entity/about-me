<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jakob Lewis | About Me</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card shadow-lg mx-auto">
  <div class="card-tabs">
    <button class="tab-btn active" onclick="switchTab('home', this)">Home</button>
    <button class="tab-btn" onclick="switchTab('contact', this)">Contact</button>
  </div>

  <div id="tab-home" class="jl-panel jl-panel--active">
    <div class="container text-center">
      <h1 id="name">Loading...</h1>
      <p id="bio" class="text-secondary small px-3">click button to load about me!</p>
      <div class="mt-4">
        <h3 class="section-heading text-uppercase small fw-bold mb-3">Core Skills</h3>
        <ul id="skills" class="list-unstyled text-secondary"></ul>
      </div>
      <button id="updateBtn" class="btn btn-primary rounded-1 mt-3" onclick="loadProfile()">
        View My Info
      </button>
    </div>
  </div>

  <div id="tab-contact" class="jl-panel">
    <div class="container text-center">
      <h1 class="contact-title">Get in Touch</h1>
      <p class="text-secondary small px-3 mb-4">Feel free to reach out via either email below.</p>
      <h3 class="section-heading text-uppercase small fw-bold mb-3">Email</h3>
      <div class="contact-links">
        <a href="mailto:Jakoblewis3000@gmail.com" class="contact-email">
          <span class="email-icon">&#x2709;</span>
          Jakoblewis3000@gmail.com
        </a>
        
        
      </div>
    </div>
  </div>
</div>

<div id="vanta-canvas"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@0.5.24/dist/vanta.clouds.min.js"></script>
<script src="script.js"></script>
</body>
</html>
